<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concrete Section Drafter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#0f1117;--panel:#181b24;--panel-border:#262a36;--accent:#bada55;--text:#e0e2e8;--text-dim:#7a7f8e;--input-bg:#1e2230;--input-border:#363b4a;--radius:8px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow:hidden;}
.app-header{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--panel-border);background:var(--panel);}
.app-header h1{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--accent);letter-spacing:1px;}
.app-header span{font-size:11px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}
.app-layout{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 49px);}
.controls{background:var(--panel);border-right:1px solid var(--panel-border);overflow:hidden;display:flex;flex-direction:column;}
.controls-sticky{padding:12px 18px 8px;background:var(--panel);border-bottom:1px solid var(--panel-border);flex-shrink:0;display:flex;flex-direction:column;gap:8px;z-index:2;overflow-x:hidden;}
.controls-scroll{padding:8px 18px 16px;overflow-y:auto;overflow-x:hidden;flex:1;display:flex;flex-direction:column;gap:10px;}
.controls-footer{padding:8px 18px 12px;background:var(--panel);border-top:1px solid var(--panel-border);flex-shrink:0;}
.section-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:2px;}
.input-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0;}
.field{display:flex;flex-direction:column;gap:3px;min-width:0;}
.field label{font-size:11px;color:var(--text-dim);font-weight:500;}
.field input,.field select{background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius);padding:7px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;transition:border-color .2s;width:100%;min-width:0;box-sizing:border-box;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.segmented{display:flex;background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius);overflow:hidden;}
.segmented button{flex:1;padding:7px 4px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;border:none;background:transparent;color:var(--text-dim);cursor:pointer;transition:all .2s;}
.segmented button.active{background:var(--accent);color:#111;}
.divider{height:1px;background:var(--panel-border);margin:2px 0;}
.export-btn{width:100%;padding:11px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:1px;background:var(--accent);color:#111;border:none;border-radius:var(--radius);cursor:pointer;transition:opacity .2s;}
.export-btn:hover{opacity:.85;}
.canvas-area{background:var(--bg);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.canvas-area svg{width:100%;height:100%;}
.canvas-info{position:absolute;bottom:10px;right:14px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);}
@media(max-width:900px){
  .app-header h1{font-size:12px;}.app-header span{display:none;}
  .app-layout{grid-template-columns:1fr;grid-template-rows:1fr auto;}
  .canvas-area{order:1;min-height:0;}.controls{order:2;max-height:55vh;border-right:none;border-top:1px solid var(--panel-border);}
}
</style>
</head>
<body>
<div class="app-header">
  <h1>CONCRETE SECTION DRAFTER</h1>
  <span>// reinforcing cross-section → DXF</span>
</div>
<div class="app-layout">
  <div class="controls" id="controls">
    <div class="controls-sticky">
      <div class="section-label">Reinforcing Type</div>
      <div class="segmented" id="modeSeg">
        <button class="active" data-val="column">Column</button>
        <button data-val="slab">Slab / Wall</button>
      </div>
      <div class="input-group">
        <div class="field"><label>Width (mm)</label><input type="number" id="secWidth" value="600" min="50" step="10"></div>
        <div class="field"><label>Depth (mm)</label><input type="number" id="secDepth" value="600" min="50" step="10"></div>
      </div>
      <div class="input-group">
        <div class="field"><label>Cover (mm)</label><input type="number" id="cover" value="40" min="10" step="5"></div>
      </div>
    </div>

    <div class="controls-scroll">
      <!-- COLUMN -->
      <div id="colPanel">
        <div class="section-label">Column Reinforcing</div>
        <div class="input-group">
          <div class="field"><label>Bar Size</label>
            <select id="colBar"><option value="12">N12</option><option value="16" selected>N16</option><option value="20">N20</option><option value="24">N24</option><option value="28">N28</option><option value="32">N32</option><option value="36">N36</option><option value="40">N40</option></select>
          </div>
          <div class="field"><label>Ligature Size</label>
            <select id="ligSize"><option value="10" selected>R10</option><option value="12">N12</option><option value="16">N16</option></select>
          </div>
        </div>
        <div class="input-group" style="margin-top:8px">
          <div class="field"><label>Bars Top</label><input type="number" id="barsTop" value="3" min="2" step="1"></div>
          <div class="field"><label>Bars Bottom</label><input type="number" id="barsBot" value="3" min="2" step="1"></div>
        </div>
        <div class="input-group" style="margin-top:8px">
          <div class="field"><label>Bars Left (intermed.)</label><input type="number" id="barsLeft" value="2" min="0" step="1"></div>
          <div class="field"><label>Bars Right (intermed.)</label><input type="number" id="barsRight" value="2" min="0" step="1"></div>
        </div>
        <div class="input-group" style="margin-top:8px">
          <div class="field"><label>Corner Chamfer (mm)</label><input type="number" id="chamfer" value="20" min="0" step="5"></div>
        </div>
        <div class="divider" style="margin:8px 0"></div>
        <div class="section-label">Side Elevations (DXF only)</div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;padding:6px 0;">
          <input type="checkbox" id="inclElev" style="width:auto;min-width:auto;accent-color:var(--accent);">
          Include side elevations
        </label>
        <div class="input-group" style="margin-top:4px">
          <div class="field"><label>Column Height (mm)</label><input type="number" id="colHeight" value="3000" min="500" step="100"></div>
          <div class="field"><label>Lig Spacing (mm)</label><input type="number" id="ligSpacing" value="300" min="50" step="25"></div>
        </div>
        <div class="input-group" style="margin-top:4px">
          <div class="field"><label>Starter Ext. (mm)</label><input type="number" id="starterLap" value="200" min="50" step="25"></div>
          <div class="field"><label>Starter Offset (mm)</label><input type="number" id="starterOff" value="10" min="5" step="5"></div>
        </div>
      </div>

      <!-- SLAB -->
      <div id="slabPanel" style="display:none">
        <div class="section-label">Slab / Wall Reinforcing</div>
        <div class="input-group">
          <div class="field"><label>Longitudinal Bar</label>
            <select id="slabLong"><option value="12">N12</option><option value="16" selected>N16</option><option value="20">N20</option><option value="24">N24</option><option value="28">N28</option><option value="32">N32</option></select>
          </div>
          <div class="field"><label>Long. Spacing (mm)</label><input type="number" id="slabLongSp" value="200" min="50" step="25"></div>
        </div>
        <div class="input-group" style="margin-top:8px">
          <div class="field"><label>Transverse Bar</label>
            <select id="slabTrans"><option value="12" selected>N12</option><option value="16">N16</option><option value="20">N20</option><option value="24">N24</option><option value="28">N28</option><option value="32">N32</option></select>
          </div>
        </div>
        <div class="divider" style="margin:8px 0"></div>
        <div class="section-label">Layer Config</div>
        <div class="segmented" id="layerSeg">
          <button class="active" data-val="dual">Dual (each face)</button>
          <button data-val="single">Single Central</button>
        </div>
        <div id="orderWrap" style="margin-top:6px">
          <div class="section-label">Bar Order (outermost first)</div>
          <div class="segmented" id="orderSeg">
            <button class="active" data-val="trans_out">Trans. Outside</button>
            <button data-val="long_out">Long. Outside</button>
          </div>
        </div>
        <div class="divider" style="margin:8px 0"></div>

        <!-- DUAL end treatments -->
        <div id="endsDual">
          <div class="section-label">Bottom Bar Ends</div>
          <div class="input-group">
            <div class="field"><label>Left End</label>
              <select id="endBotL"><option value="none" selected>Straight</option><option value="cog90">90° Cog</option><option value="hook180">180° Hook</option></select>
            </div>
            <div class="field"><label>Right End</label>
              <select id="endBotR"><option value="none" selected>Straight</option><option value="cog90">90° Cog</option><option value="hook180">180° Hook</option></select>
            </div>
          </div>
          <div class="section-label" style="margin-top:6px">Top Bar Ends</div>
          <div class="input-group">
            <div class="field"><label>Left End</label>
              <select id="endTopL"><option value="none" selected>Straight</option><option value="cog90">90° Cog</option><option value="hook180">180° Hook</option></select>
            </div>
            <div class="field"><label>Right End</label>
              <select id="endTopR"><option value="none" selected>Straight</option><option value="cog90">90° Cog</option><option value="hook180">180° Hook</option></select>
            </div>
          </div>
        </div>

        <!-- SINGLE end treatments -->
        <div id="endsSingle" style="display:none">
          <div class="section-label">Bar Ends</div>
          <div class="input-group">
            <div class="field"><label>Left End</label>
              <select id="endMidL"><option value="none" selected>Straight</option><option value="cog90">90° Cog</option><option value="hook180">180° Hook</option></select>
            </div>
            <div class="field"><label>Right End</label>
              <select id="endMidR"><option value="none" selected>Straight</option><option value="cog90">90° Cog</option><option value="hook180">180° Hook</option></select>
            </div>
          </div>
        </div>

        <div class="divider" style="margin:8px 0"></div>
        <div class="section-label">Elevation (DXF only)</div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;padding:6px 0;">
          <input type="checkbox" id="inclSlabElev" style="width:auto;min-width:auto;accent-color:var(--accent);">
          Include elevation
        </label>
        <div class="input-group" style="margin-top:4px">
          <div class="field"><label>Wall/Slab Height (mm)</label><input type="number" id="slabHeight" value="3000" min="500" step="100"></div>
          <div class="field"><label>Horiz. Bar Spacing (mm)</label><input type="number" id="slabHorizSp" value="200" min="50" step="25"></div>
        </div>
        <div class="input-group" style="margin-top:4px">
          <div class="field"><label>Starter Ext. (mm)</label><input type="number" id="slabStarterExt" value="200" min="50" step="25"></div>
          <div class="field"><label>Starter Offset (mm)</label><input type="number" id="slabStarterOff" value="10" min="5" step="5"></div>
        </div>
      </div>
    </div>

    <div class="controls-footer" style="display:flex;gap:8px;">
      <button class="export-btn" id="exportBtn" style="flex:1;">EXPORT DXF</button>
      <button class="export-btn" id="copyBtn" style="flex:1;background:#363b4a;color:var(--text);">COPY TO CLIPBOARD</button>
    </div>
  </div>

  <div class="canvas-area">
    <svg id="preview"></svg>
    <div class="canvas-info" id="canvasInfo"></div>
  </div>
</div>

<script>
// ================================================================
//  SDXF LIBRARY (embedded) — AC1015 (R2000) subset of sdxf.js
//  Unique handles + owners, AcDb subclass markers, root DICTIONARY,
//  $HANDSEED from the last handle used. Hatch / HATCH_PATTERNS match
//  sdxf.js: real HATCH entities (SOLID, ANSI31/32/37, NET, DOTS, EARTH
//  or { name, lines }) instead of hand-drawn aggregate symbols.
// ================================================================
const NL=String.fromCharCode(10);
let _dxfHandle=1,_H_MODEL_BTR='0';
function _nextHandle(){return(_dxfHandle++).toString(16).toUpperCase();}
function _point(x,index=0){return x.map((v,i)=>`${(i+1)*10+index}${NL}${v}`).join(NL);}
const _num=v=>Number(v.toFixed(10));
const _rot=([x,y],deg)=>{const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r);return[x*c-y*s,x*s+y*c];};
class Entity{
  constructor({color=256,layer='0',lineType=null,lineWeight=null}={}){this.color=color;this.layer=layer;this.lineType=lineType;this.lineWeight=lineWeight;}
  // Group 5: unique handle. Group 330: owner = *Model_Space block record.
  _common(){const l=['5',_nextHandle(),'330',_H_MODEL_BTR,'100','AcDbEntity','8',this.layer];if(this.lineType!==null)l.push('6',this.lineType);if(this.lineWeight!==null)l.push('370',this.lineWeight);if(this.color!==null&&this.color!==256)l.push('62',this.color);return l.join(NL);}
}
class Layer_{
  constructor({name='0',color=7,lineType='Continuous'}={}){this.name=name.toUpperCase();this.color=color;this.lineType=lineType;}
  _rec(owner){return['0','LAYER','5',_nextHandle(),'330',owner,'100','AcDbSymbolTableRecord','100','AcDbLayerTableRecord','2',this.name,'70','0','62',this.color,'6',this.lineType,'370','-3','390','0'].join(NL);}
}
// LWPOLYLINE (2D). closed:1 closes it; bulge applies to every vertex, bulges[] per vertex.
class LwPolyLine_ extends Entity{
  constructor(points,{closed=0,width=null,bulge=null,bulges=null,...co}={}){super(co);this.points=points;this.closed=closed;this.width=width;this.bulge=bulge;this.bulges=bulges;}
  toString(){if(!this.points||this.points.length<2)return'';const l=['0','LWPOLYLINE',this._common(),'100','AcDbPolyline','90',this.points.length,'70',this.closed?1:0];if(this.width!==null)l.push('43',this.width);this.points.forEach((p,i)=>{l.push('10',p[0],'20',p[1]);const b=this.bulges?this.bulges[i]:this.bulge;if(b!=null)l.push('42',b);});return l.join(NL);}
}
class Circle_ extends Entity{constructor(center=[0,0,0],radius=1,co={}){super(co);this.center=center;this.radius=radius;}toString(){return['0','CIRCLE',this._common(),'100','AcDbCircle',_point(this.center),'40',this.radius].join(NL);}}

// ── Hatch (as sdxf.js) ───────────────────────────────────────────
// acadiso.pat pattern lines: [angle, baseX, baseY, offsetX, offsetY, ...dashes]
const HATCH_PATTERNS={
  ANSI31:[[45,0,0,0,3.175]],                                        // general / brick / concrete section
  ANSI32:[[45,0,0,0,9.525],[45,4.490128,0,0,9.525]],                // steel
  ANSI37:[[45,0,0,0,3.175],[135,0,0,0,3.175]],                      // lead / cross hatch
  NET:[[0,0,0,0,3.175],[90,0,0,0,3.175]],
  DOTS:[[0,0,0,0.79375,1.5875,0,-1.5875]],
  EARTH:[[0,0,0,6.35,6.35,6.35,-6.35],[0,0,2.38125,6.35,6.35,6.35,-6.35],
         [0,0,4.7625,6.35,6.35,6.35,-6.35],[90,0.79375,5.55625,6.35,6.35,6.35,-6.35],
         [90,3.175,5.55625,6.35,6.35,6.35,-6.35],[90,5.55625,5.55625,6.35,6.35,6.35,-6.35]],
};
/**
 * Hatch inside one or more closed boundaries (the first is the outer, the rest are holes).
 *   new Hatch([[0,0],[100,0],[100,50],[0,50]],{pattern:'ANSI31',scale:2})
 *   new Hatch([outerPts,holePts],{pattern:'SOLID',color:8})
 * A boundary is a point list or an LwPolyLine_ (its bulges are kept).
 */
class Hatch extends Entity{
  constructor(boundaries,{pattern='SOLID',scale=1,angle=0,...co}={}){
    super(co);
    const single=boundaries instanceof LwPolyLine_||typeof boundaries?.[0]?.[0]==='number';
    const list=single?[boundaries]:boundaries;
    this.paths=list.map(b=>b instanceof LwPolyLine_
      ?[b.points.map(p=>[p[0],p[1]]),b.bulges?[...b.bulges]:(b.bulge!==null?b.points.map(()=>b.bulge):null)]
      :[b.map(p=>[p[0],p[1]]),null]);
    // 3+ points, or 2 points joined by arcs (e.g. a circle made of two bulges)
    if(!this.paths.length||this.paths.some(([p,bg])=>p.length<(bg&&bg.some(x=>x)?2:3)))
      throw new Error('Hatch boundaries need at least 3 points each (or 2 with bulges)');
    if(typeof pattern==='string'){
      const name=pattern.toUpperCase();
      if(name!=='SOLID'&&!HATCH_PATTERNS[name])
        throw new Error(`Unknown hatch pattern '${pattern}'. Use SOLID, ${Object.keys(HATCH_PATTERNS).join(', ')} or { name, lines }`);
      this.pattern={name,lines:HATCH_PATTERNS[name]||[]};
    }else this.pattern={name:pattern.name.toUpperCase(),lines:pattern.lines};
    this.scale=scale;this.angle=angle;
  }
  get solid(){return this.pattern.name==='SOLID';}
  toString(){
    const l=['0','HATCH',this._common(),'100','AcDbHatch','10','0','20','0','30','0','210','0','220','0','230','1',
             '2',this.pattern.name,'70',this.solid?1:0,'71','0','91',this.paths.length];
    this.paths.forEach(([pts,bulges],i)=>{
      const hasBulge=!!bulges&&bulges.some(b=>b);
      l.push('92',i===0?3:2,'72',hasBulge?1:0,'73','1','93',pts.length);  // 1 external | 2 polyline
      pts.forEach((p,k)=>{l.push('10',p[0],'20',p[1]);if(hasBulge)l.push('42',bulges[k]||0);});
      l.push('97','0');
    });
    l.push('75','0','76','1');   // normal island style, predefined pattern
    if(!this.solid){
      l.push('52',this.angle,'41',this.scale,'77','0','78',this.pattern.lines.length);
      for(const[a,bx,by,dx,dy,...dashes]of this.pattern.lines){
        const base=_rot([bx*this.scale,by*this.scale],this.angle);
        const off=_rot([dx*this.scale,dy*this.scale],a+this.angle);
        l.push('53',a+this.angle,'43',_num(base[0]),'44',_num(base[1]),'45',_num(off[0]),'46',_num(off[1]),'79',dashes.length);
        dashes.forEach(d=>l.push('49',_num(d*this.scale)));
      }
    }
    l.push('98','0');
    return l.join(NL);
  }
}

class Drawing_{
  constructor({layers=[],entities=[],extmin=[0,0],extmax=[0,0]}={}){this.layers=layers;this.entities=entities;this.extmin=extmin;this.extmax=extmax;}
  _section(n,items){const f=items.filter(s=>s&&s.trim());return['0','SECTION','2',n,...(f.length?[f.join(NL)]:[]),'0','ENDSEC'].join(NL);}
  _table(n,h,owner,recs){return['0','TABLE','2',n,'5',h,'330',owner,'100','AcDbSymbolTable','70',recs.length,...(n==='DIMSTYLE'?['100','AcDbDimStyleTable']:[]),...recs,'0','ENDTAB'].join(NL);}
  toString(){
    _dxfHandle=1;
    const H=()=>_nextHandle();
    const hRoot=H(),hGroups=H();
    const tbl={};['VPORT','LTYPE','LAYER','STYLE','VIEW','UCS','APPID','DIMSTYLE','BLOCK_RECORD'].forEach(n=>tbl[n]=H());
    _H_MODEL_BTR=H();const hPaper=H();
    const rec=(type,owner,sub,...rest)=>['0',type,'5',H(),'330',owner,'100','AcDbSymbolTableRecord','100',sub,...rest].join(NL);
    const ltypes=[['ByBlock',''],['ByLayer',''],['Continuous','Solid line']].map(([n,d])=>rec('LTYPE',tbl.LTYPE,'AcDbLinetypeTableRecord','2',n,'70','0','3',d,'72','65','73','0','40','0.0'));
    const layers=[...this.layers];
    if(!layers.some(x=>x.name==='0'))layers.unshift(new Layer_());
    const dimstyle=['0','DIMSTYLE','105',H(),'330',tbl.DIMSTYLE,'100','AcDbSymbolTableRecord','100','AcDbDimStyleTableRecord','2','Standard','70','0'].join(NL);
    const tables=this._section('TABLES',[
      this._table('VPORT',tbl.VPORT,'0',[]),
      this._table('LTYPE',tbl.LTYPE,'0',ltypes),
      this._table('LAYER',tbl.LAYER,'0',layers.map(x=>x._rec(tbl.LAYER))),
      this._table('STYLE',tbl.STYLE,'0',[rec('STYLE',tbl.STYLE,'AcDbTextStyleTableRecord','2','Standard','70','0','40','0','41','1','50','0','71','0','42','2.5','3','txt','4','')]),
      this._table('VIEW',tbl.VIEW,'0',[]),
      this._table('UCS',tbl.UCS,'0',[]),
      this._table('APPID',tbl.APPID,'0',[rec('APPID',tbl.APPID,'AcDbRegAppTableRecord','2','ACAD','70','0')]),
      this._table('DIMSTYLE',tbl.DIMSTYLE,'0',[dimstyle]),
      this._table('BLOCK_RECORD',tbl.BLOCK_RECORD,'0',[[_H_MODEL_BTR,'*Model_Space'],[hPaper,'*Paper_Space']].map(([h,n])=>
        ['0','BLOCK_RECORD','5',h,'330',tbl.BLOCK_RECORD,'100','AcDbSymbolTableRecord','100','AcDbBlockTableRecord','2',n,'340','0'].join(NL))),
    ]);
    const blk=(owner,n)=>['0','BLOCK','5',H(),'330',owner,'100','AcDbEntity','8','0','100','AcDbBlockBegin','2',n,'70','0',_point([0,0,0]),'3',n,'1','',
                          '0','ENDBLK','5',H(),'330',owner,'100','AcDbEntity','8','0','100','AcDbBlockEnd'].join(NL);
    const blocks=this._section('BLOCKS',[blk(_H_MODEL_BTR,'*Model_Space'),blk(hPaper,'*Paper_Space')]);
    const entities=this._section('ENTITIES',this.entities.map(e=>e.toString()));
    const objects=this._section('OBJECTS',[
      ['0','DICTIONARY','5',hRoot,'330','0','100','AcDbDictionary','281','1','3','ACAD_GROUP','350',hGroups].join(NL),
      ['0','DICTIONARY','5',hGroups,'330',hRoot,'100','AcDbDictionary','281','1'].join(NL),
    ]);
    // HEADER written last so $HANDSEED is above every handle used
    const header=this._section('HEADER',[
      ['9','$ACADVER','1','AC1015'].join(NL),
      ['9','$HANDSEED','5',H()].join(NL),
      ['9','$INSUNITS','70','4'].join(NL),
      ['9','$MEASUREMENT','70','1'].join(NL),
      ['9','$EXTMIN',_point([...this.extmin,0])].join(NL),
      ['9','$EXTMAX',_point([...this.extmax,0])].join(NL),
    ]);
    return[header,tables,blocks,entities,objects,'0','EOF',''].join(NL);
  }
}

// ================================================================
//  HOOK / COG DIMENSIONS per AS 3600 Cl 13.1.2.7 / REODATA p31
//  pin = 5db for D500N. cog90 = overall 'c' dim. hook180 = 'a' dim.
// ================================================================
const HOOK_COG={
  10:{hook180:105,cog90:155,pin:5},12:{hook180:115,cog90:170,pin:5},
  16:{hook180:130,cog90:205,pin:5},20:{hook180:150,cog90:245,pin:5},
  24:{hook180:180,cog90:295,pin:5},28:{hook180:210,cog90:345,pin:5},
  32:{hook180:240,cog90:395,pin:5},36:{hook180:270,cog90:440,pin:5},
  40:{hook180:300,cog90:490,pin:5}
};

// ================================================================
//  GEOMETRY
// ================================================================
function gp(){return{W:+$('secWidth').value,D:+$('secDepth').value,cover:+$('cover').value};}

// --- Bend geometry helpers ---
function bendR(db){const hc=HOOK_COG[db]||HOOK_COG[16];return hc.pin*db/2;}

// For a cog/hook at a bar end, the bend occupies space sideways from the
// bar end. The outermost point of the bend (outside of bar centreline)
// must maintain cover to the concrete face.
// 90° cog: bend radius + db/2 clearance needed from the bar end inward
// The bar x1/x2 must shift in by (bendR + db/2) - (bendR) = db/2 extra
// beyond the cover line... but actually the issue is the bend arc
// swings outward from the bar centreline toward the near face.
//
// Cover is measured to the OUTSIDE of the bar. For a straight bar at
// y = cover + db/2, the outside face is at y - db/2 = cover. Good.
// For a cog bending downward (bottom bar, inward), the lowest point of
// the bend outside is at y - bendR - db/2. For this to equal cover:
//   y = cover + bendR + db/2
// So the bar centreline must shift inward by (bendR) relative to the
// straight bar position of cover + db/2.
//
// For a 180° hook bending inward, the outermost point is also at
// y - bendR - db/2. Same shift.
//
// For the horizontal extent: a cog at the left end has its arc centre
// at (x + bendR, y). The leftmost point of the outside of the arc is
// at x + bendR - bendR - db/2 = x - db/2. For this to be at cover:
//   x = cover + db/2 (same as straight). OK no extra shift needed
//   because the bar already starts at cover from the face.
// Actually: the bar polyline starts at x1, and the cog arc extends
// further LEFT than x1 by the bend radius. The arc centre is at
// (x1 + bendR, y), arc starts at (x1, y) and swings to (x1+bendR,
// y±bendR). The outside of the bend at the start is at x1 - db/2.
// For cover: x1 - db/2 >= cover  →  x1 >= cover + db/2.
// That's the same as a straight bar. But the ARC ITSELF goes from
// x1 to x1+bendR. At the very start it's at x1 which for the bar
// outside = x1 - db/2. So x1 = cover + db/2 is correct.
//
// So: for cog/hook, the bar Y shifts inward by bendR, and the bar
// X stays at cover + db/2 (but we draw from x=cover for a wide pline
// of width=db, so the centreline is already at cover, and the outside
// of the wide polyline extends to cover - db/2... that's wrong).
//
// With a WIDE polyline of width=db, the centreline IS at y, and the
// outside face is at y - db/2. So for the straight bar drawn as a
// wide polyline at y = cover + transD/2, the outside = cover. Good.
//
// For the cog bend: the arc is drawn as a separate wide polyline.
// The arc centreline radius is bendR. The outside of the wide pline
// at the tightest point of the bend = arc_centre - bendR - db/2
// from the near face. For this to maintain cover from y=0 (bottom face):
//   y_bar - (nothing, the bend goes inward i.e. upward for bottom bars)
// Wait: bottom bars bend INWARD = upward into the section. The cog
// does NOT swing toward the bottom face. So no cover issue on that side.
//
// The issue is at the LEFT and RIGHT ends where the cog/hook bends.
// For a left-end cog on a bottom bar: the arc curves from horizontal
// to vertical (upward). The arc goes INWARD (rightward from left end,
// upward). There's no encroachment toward the left face beyond x1.
// OK so actually the straight bar cover is fine for the ends.
//
// But for a 180° hook at the left end: the hook swings a full
// semicircle inward then the tail comes back. The extreme left point
// is x1 (the bar end). The hook goes rightward and upward, not left.
// So again no encroachment past x1.
//
// WHERE the cover issue arises: if the cog/hook bends TOWARD a face
// (not away from it). For a bottom bar cog that bends UPWARD, the
// bend goes away from the bottom face — no issue. But the TAIL of
// the cog extends upward and may collide with the perpendicular bars.
//
// The REAL geometric issue is:
// 1. For dual layer bottom bars with trans_out: the transverse bar is
//    at y = cover + transD/2. A cog bends upward. Fine.
//    But on a top bar (y = D - cover - transD/2), a cog bends downward
//    (inward). Also fine — away from top face.
//
// 2. The perpendicular (circle) bars need to be pushed in from the
//    ends where cogs/hooks exist, because the cog tail extends inward
//    along x. A cog tail at the left end extends from x1 to about
//    x1 + bendR (the arc) + some. The circle bars should start after
//    the cog/hook zone.
//
// Let me just implement the practical fixes:
// - Bar Y: keep as-is (cover + db/2 for outermost), the bends go inward
// - Bar X: keep x1=cover, x2=W-cover for the main bar
// - Cog/hook starts at x1 or x2 and curves inward — no cover violation
// - Circle bars: push x1 in by cog/hook encroachment at left end,
//   push x2 in by cog/hook encroachment at right end
// - For single layer: the bar is at mid-depth. Cog direction is
//   configurable but we'll default upward.

function cogEncroachment(db){
  // How far the cog/hook extends horizontally inward from the bar end
  // 90° cog: the arc radius extends inward, plus there's no further
  // horizontal extent (tail goes vertical). So encroachment = bendR.
  return bendR(db);
}

function hookEncroachment(db){
  // 180° hook: the arc diameter extends inward, then the tail extends
  // further inward. Encroachment = 2*bendR + tailLen.
  // But actually the hook at the left end: arc centre at (x, y+dir*r),
  // arc swings from (x, y) to (x, y+dir*2r). The rightmost point of
  // the arc is at x+r. Then tail goes from (x, y+dir*2r) rightward
  // by tailLen. So horizontal encroachment = max(r, tailLen).
  // Actually looking at the geometry: the 180° hook semicircle has its
  // rightmost point at x + r (the arc centre x + r). Then the tail
  // extends from x to x + tailLen. So encroachment = tailLen (since
  // tailLen = max(4db, 70) which is typically > r = 2.5db).
  const r=bendR(db);
  const tail=Math.max(4*db,70);
  return Math.max(r, tail);
}

function getEncroachment(endType, db){
  if(endType==='cog90') return cogEncroachment(db);
  if(endType==='hook180') return hookEncroachment(db);
  return 0;
}

function colGeom(){
  const{W,D,cover}=gp();
  const barD=+$('colBar').value,ligD=+$('ligSize').value;
  const nT=+$('barsTop').value,nB=+$('barsBot').value;
  const nL=+$('barsLeft').value,nR=+$('barsRight').value;
  const chamfer=+$('chamfer').value||0;
  const ligOff=cover+ligD/2;
  const barIn=cover+ligD+barD/2;
  const lx=ligOff,rx=W-ligOff,by=ligOff,ty=D-ligOff;
  const ligR=Math.min(4*ligD,(rx-lx)/2,(ty-by)/2);

  const barFromLig=ligD/2+barD/2;
  const cBarR=ligR-barFromLig;
  const midAngles=[225,315,45,135];
  const arcC=[{cx:lx+ligR,cy:by+ligR},{cx:rx-ligR,cy:by+ligR},{cx:rx-ligR,cy:ty-ligR},{cx:lx+ligR,cy:ty-ligR}];

  const cornerBars=arcC.map((a,i)=>{
    const ang=midAngles[i]*Math.PI/180;
    return{x:a.cx+cBarR*Math.cos(ang),y:a.cy+cBarR*Math.sin(ang),isCorner:true};
  });

  const bars=[...cornerBars];
  if(nT>2){const topY=D-barIn;const x1=cornerBars[3].x,x2=cornerBars[2].x;const sp=(x2-x1)/(nT-2+1);for(let i=1;i<=nT-2;i++)bars.push({x:x1+i*sp,y:topY});}
  if(nB>2){const botY=barIn;const x1=cornerBars[0].x,x2=cornerBars[1].x;const sp=(x2-x1)/(nB-2+1);for(let i=1;i<=nB-2;i++)bars.push({x:x1+i*sp,y:botY});}
  if(nL>0){const leftX=barIn;const y1=cornerBars[0].y,y2=cornerBars[3].y;const sp=(y2-y1)/(nL+1);for(let i=1;i<=nL;i++)bars.push({x:leftX,y:y1+i*sp});}
  if(nR>0){const rightX=W-barIn;const y1=cornerBars[1].y,y2=cornerBars[2].y;const sp=(y2-y1)/(nR+1);for(let i=1;i<=nR;i++)bars.push({x:rightX,y:y1+i*sp});}

  return{bars,barD,ligD,ligOff,ligR,lx,rx,by,ty,W,D,cover,chamfer};
}

function slabGeom(){
  const{W,D,cover}=gp();
  const longD=+$('slabLong').value,longSp=+$('slabLongSp').value;
  const transD=+$('slabTrans').value;
  const dual=layerCfg==='dual',tOut=barOrder==='trans_out';

  // Read end treatments based on layer mode
  let endBotL,endBotR,endTopL,endTopR;
  if(dual){
    endBotL=$('endBotL').value;endBotR=$('endBotR').value;
    endTopL=$('endTopL').value;endTopR=$('endTopR').value;
  } else {
    endBotL=endTopL=$('endMidL').value;
    endBotR=endTopR=$('endMidR').value;
  }

  const lineLayers=[],circLayers=[];
  if(dual){
    if(tOut){
      lineLayers.push({y:cover+transD/2,dia:transD,face:'bot'});
      circLayers.push({y:cover+transD+longD/2,dia:longD,sp:longSp});
      lineLayers.push({y:D-cover-transD/2,dia:transD,face:'top'});
      circLayers.push({y:D-cover-transD-longD/2,dia:longD,sp:longSp});
    } else {
      lineLayers.push({y:cover+longD+transD/2,dia:transD,face:'bot'});
      circLayers.push({y:cover+longD/2,dia:longD,sp:longSp});
      lineLayers.push({y:D-cover-longD-transD/2,dia:transD,face:'top'});
      circLayers.push({y:D-cover-longD/2,dia:longD,sp:longSp});
    }
  } else {
    // Single central: both directions at mid-depth
    // Transverse slightly below centre, longitudinal slightly above
    lineLayers.push({y:D/2-transD/2,dia:transD,face:'mid'});
    circLayers.push({y:D/2+longD/2,dia:longD,sp:longSp});
  }

  const lines=lineLayers.map(l=>{
    let eL='none',eR='none';
    if(l.face==='bot'){eL=endBotL;eR=endBotR;}
    else if(l.face==='top'){eL=endTopL;eR=endTopR;}
    else if(l.face==='mid'){eL=$('endMidL').value;eR=$('endMidR').value;}
    // Wide polyline centreline must be db/2 inside the cover line
    // so the outside face of the polyline sits at the cover distance.
    // When a cog/hook is present, shorten the main bar by the bend radius
    // so it meets the start of the arc without overlap.
    const baseL=cover+l.dia/2;
    const baseR=W-cover-l.dia/2;
    const trimL=(eL!=='none')?bendR(l.dia):0;
    const trimR=(eR!=='none')?bendR(l.dia):0;
    // cogX: passed to makeCogPts as the vertical leg x position.
    // The function places arc centre at cogX, arc starts at cogX+r (left) or cogX-r (right).
    // For the arc to start at the bar end (x1/x2), and the leg at baseL/baseR:
    // cogX = baseL for left, cogX = baseR for right.
    return{y:l.y,dia:l.dia,x1:baseL+trimL,x2:baseR-trimR,endLeft:eL,endRight:eR,face:l.face,
           cogX1:baseL,cogX2:baseR};
  });

  // Compute max encroachment at left and right from all line layers
  let encrL=0, encrR=0;
  lines.forEach(l=>{
    encrL=Math.max(encrL,getEncroachment(l.endLeft,l.dia));
    encrR=Math.max(encrR,getEncroachment(l.endRight,l.dia));
  });

  // Circle bars pushed in past cog/hook zones
  const circles=[];
  const safeLongSp=Math.max(longSp, longD, 1); // never less than bar dia or 1mm
  circLayers.forEach(cl=>{
    const baseL=cover+cl.dia/2;
    const baseR=W-cover-cl.dia/2;
    const x1=Math.max(baseL, cover+encrL+cl.dia/2);
    const x2=Math.min(baseR, W-cover-encrR-cl.dia/2);
    if(x2<=x1){
      circles.push({x:W/2,y:cl.y,dia:cl.dia});
    } else {
      const span=x2-x1;
      const n=Math.max(1,Math.min(200,Math.floor(span/safeLongSp)+1));
      const actSp=n>1?span/(n-1):0;
      for(let i=0;i<n;i++) circles.push({x:x1+i*actSp,y:cl.y,dia:cl.dia});
    }
  });

  return{lines,circles,longD,transD,W,D,cover};
}

// ================================================================
//  ARC POINT HELPER
// ================================================================
function arcPts(cx,cy,r,startDeg,endDeg,n=8){
  const pts=[];const s=startDeg*Math.PI/180,e=endDeg*Math.PI/180;
  for(let i=0;i<=n;i++){const a=s+(e-s)*(i/n);pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
  return pts;
}

// ================================================================
//  D3 PREVIEW
// ================================================================
function redraw(){
  try{
  const{W,D,cover}=gp();
  if(W<=0||D<=0||cover<0) return;
  $('canvasInfo').textContent=`${W} × ${D} mm`;
  const svg=d3.select('#preview');svg.selectAll('*').remove();
  const ct=svg.node().parentElement;
  const cw=ct.clientWidth,ch=ct.clientHeight,m=60;
  if(cw<=0||ch<=0) return;
  const sc=Math.min((cw-2*m)/W,(ch-2*m)/D);
  if(sc<=0||!isFinite(sc)) return;
  const ox=(cw-W*sc)/2,oy=(ch-D*sc)/2;
  const g=svg.append('g').attr('transform',`translate(${ox},${oy+D*sc}) scale(${sc},${-sc})`);
  for(let x=0;x<=W;x+=50)for(let y=0;y<=D;y+=50)
    g.append('circle').attr('cx',x).attr('cy',y).attr('r',.8/sc).attr('fill','#ffffff0a');
  if(mode==='column')drawColPrev(g,sc);else drawSlabPrev(g,sc);
  }catch(e){console.warn('redraw:',e);}
}

function drawConcreteOutline(g,sc,W,D,cover,chamfer){
  if(chamfer>0){
    g.append('path').attr('d',chamferRectPath(0,0,W,D,chamfer))
      .attr('fill','#4caf5008').attr('stroke','#4caf50').style('stroke-width',2/sc);
  }else{
    g.append('rect').attr('x',0).attr('y',0).attr('width',W).attr('height',D)
      .attr('fill','#4caf5008').attr('stroke','#4caf50').style('stroke-width',2/sc);
  }
  g.append('rect').attr('x',cover).attr('y',cover).attr('width',W-2*cover).attr('height',D-2*cover)
    .attr('fill','none').attr('stroke','#4caf5033').style('stroke-width',1/sc)
    .attr('stroke-dasharray',`${6/sc},${4/sc}`);
}

function drawColPrev(g,sc){
  const c=colGeom();
  drawConcreteOutline(g,sc,c.W,c.D,c.cover,c.chamfer);
  g.append('path').attr('d',roundedRectPath(c.lx,c.by,c.rx,c.ty,c.ligR))
    .attr('fill','none').attr('stroke','#f44336').style('stroke-width',c.ligD).attr('stroke-linejoin','round');
  c.bars.forEach(b=>{
    g.append('circle').attr('cx',b.x).attr('cy',b.y).attr('r',c.barD/2)
      .attr('fill','#f44336').attr('stroke','#c62828').style('stroke-width',.5/sc);
  });
}

function drawSlabPrev(g,sc){
  const s=slabGeom();
  drawConcreteOutline(g,sc,s.W,s.D,s.cover,0);
  s.lines.forEach(l=>{
    const db=l.dia,hc=HOOK_COG[db]||HOOK_COG[16],r=bendR(db);
    const dir=(l.face==='top')?-1:1;
    // Main bar uses trimmed x1/x2
    g.append('line').attr('x1',l.x1).attr('y1',l.y).attr('x2',l.x2).attr('y2',l.y)
      .attr('stroke','#f44336').style('stroke-width',db).attr('stroke-linecap','butt');
    // Cogs use base cover position so vertical leg sits at cover + db/2
    // Hooks use trimmed bar end so the semicircle starts at the bar end
    const cogLx=l.endLeft==='cog90'?l.cogX1:l.x1;
    const cogRx=l.endRight==='cog90'?l.cogX2:l.x2;
    drawBarEndPrev(g,cogLx,l.y,db,r,hc,dir,'left',l.endLeft,sc);
    drawBarEndPrev(g,cogRx,l.y,db,r,hc,dir,'right',l.endRight,sc);
  });
  s.circles.forEach(c=>{
    g.append('circle').attr('cx',c.x).attr('cy',c.y).attr('r',c.dia/2)
      .attr('fill','#f44336').attr('stroke','#c62828').style('stroke-width',.5/sc);
  });
}

function drawBarEndPrev(g,x,y,db,r,hc,dir,side,endType,sc){
  if(endType==='cog90'){
    // x = vertical leg position (cover + db/2)
    // Draw arc and tail as separate elements
    // Arc centre at inside corner: (x+r, y+dir*r) for left, (x-r, y+dir*r) for right
    const cogTail=Math.max(0,hc.cog90-r);
    if(side==='left'){
      // Centre at (x+r, y+dir*r). Bar end at (x+r, y) = 270° if dir=+1, 90° if dir=-1.
      // Leg top at (x, y+dir*r) = 180°.
      const cx_=x+r, cy_=y+dir*r;
      const sA=dir>0?270:90;
      const p=svgArcPath(cx_,cy_,r,sA,180);
      g.append('path').attr('d',`M${x+r},${y} `+p).attr('fill','none').attr('stroke','#f44336').style('stroke-width',db);
      // Vertical tail from leg top downward/upward
      g.append('line').attr('x1',x).attr('y1',y+dir*r).attr('x2',x).attr('y2',y+dir*(r+cogTail))
        .attr('stroke','#f44336').style('stroke-width',db);
    }else{
      // Centre at (x-r, y+dir*r). Bar end at (x-r, y) = 270° if dir=+1, 90° if dir=-1.
      // Leg top at (x, y+dir*r) = 0° (or 360° for short sweep when dir=+1).
      const cx_=x-r, cy_=y+dir*r;
      const sA=dir>0?270:90;
      const eA=dir>0?360:0;
      const p=svgArcPath(cx_,cy_,r,sA,eA);
      g.append('path').attr('d',`M${x-r},${y} `+p).attr('fill','none').attr('stroke','#f44336').style('stroke-width',db);
      // Vertical tail
      g.append('line').attr('x1',x).attr('y1',y+dir*r).attr('x2',x).attr('y2',y+dir*(r+cogTail))
        .attr('stroke','#f44336').style('stroke-width',db);
    }
  }else if(endType==='hook180'){
    const tail=Math.max(4*db,70);
    if(side==='left'){
      // Arc centre at (x, y+dir*r). Start at bottom/top of circle (bar end),
      // sweep 180° inward. Start angle points back to bar: 270° for up, 90° for down.
      const cx_=x,cy_=y+dir*r;
      const sA=dir>0?270:90,eA=dir>0?90:270;
      // Ensure we go the short 180° way: for dir>0: 270→180→90 (CCW, decreasing)
      // For dir<0: 90→180→270 (CCW, increasing). Both are 180° sweeps.
      const pts=arcPts(cx_,cy_,r,sA,eA,16);
      let d='M'+pts.map(p=>p[0]+','+p[1]).join(' L');
      const lp=pts[pts.length-1];d+=` L${lp[0]+tail},${lp[1]}`;
      g.append('path').attr('d',d).attr('fill','none').attr('stroke','#f44336').style('stroke-width',db);
    }else{
      // Right end hook: arc centre at (x, y+dir*r)
      // dir=+1: start 270°, sweep CW (increasing) to 450° (=90°+360)
      // dir=-1: start 90°, sweep CW (decreasing) to -90° (=270°-360)
      const cx_=x,cy_=y+dir*r;
      const sA=dir>0?270:90,eA=dir>0?450:-90;
      const pts=arcPts(cx_,cy_,r,sA,eA,16);
      let d='M'+pts.map(p=>p[0]+','+p[1]).join(' L');
      const lp=pts[pts.length-1];d+=` L${lp[0]-tail},${lp[1]}`;
      g.append('path').attr('d',d).attr('fill','none').attr('stroke','#f44336').style('stroke-width',db);
    }
  }
}

function svgArcPath(cx,cy,r,startDeg,endDeg){
  const pts=arcPts(cx,cy,r,startDeg,endDeg,12);
  return pts.map((p,i)=>(i===0?'':'L')+p[0]+','+p[1]).join(' ');
}

function roundedRectPath(x1,y1,x2,y2,r){
  return`M${x1+r},${y1} L${x2-r},${y1} A${r},${r} 0 0 1 ${x2},${y1+r} L${x2},${y2-r} A${r},${r} 0 0 1 ${x2-r},${y2} L${x1+r},${y2} A${r},${r} 0 0 1 ${x1},${y2-r} L${x1},${y1+r} A${r},${r} 0 0 1 ${x1+r},${y1} Z`;
}

function chamferRectPath(x1,y1,x2,y2,ch){
  return`M${x1+ch},${y1} L${x2-ch},${y1} L${x2},${y1+ch} L${x2},${y2-ch} L${x2-ch},${y2} L${x1+ch},${y2} L${x1},${y2-ch} L${x1},${y1+ch} Z`;
}

// ================================================================
//  DXF GENERATION HELPERS
// ================================================================
function roundedRectPts(x1,y1,x2,y2,r){
  const pts=[],n=8;
  pts.push([x1+r,y1]);pts.push([x2-r,y1]);
  for(let i=1;i<=n;i++){const a=-Math.PI/2+(Math.PI/2)*(i/n);pts.push([x2-r+r*Math.cos(a),y1+r+r*Math.sin(a)]);}
  pts.push([x2,y2-r]);
  for(let i=1;i<=n;i++){const a=0+(Math.PI/2)*(i/n);pts.push([x2-r+r*Math.cos(a),y2-r+r*Math.sin(a)]);}
  pts.push([x1+r,y2]);
  for(let i=1;i<=n;i++){const a=Math.PI/2+(Math.PI/2)*(i/n);pts.push([x1+r+r*Math.cos(a),y2-r+r*Math.sin(a)]);}
  pts.push([x1,y1+r]);
  for(let i=1;i<=n;i++){const a=Math.PI+(Math.PI/2)*(i/n);pts.push([x1+r+r*Math.cos(a),y1+r+r*Math.sin(a)]);}
  return pts;
}

function makeCogPts(x,y,db,side,face){
  // x = vertical leg x position (at cover + db/2)
  // Arc centre at inside corner of bend
  const hc=HOOK_COG[db]||HOOK_COG[16];
  const r=bendR(db);
  const dir=(face==='top')?-1:1;
  const cogTail=Math.max(0,hc.cog90-r);
  // Returns {arc: [...points], tail: [...points]} for two separate polylines
  if(side==='left'){
    // Centre at (x+r, y+dir*r). Bar end at (x+r, y) → angle: dir>0?270:90. Leg top at (x, y+dir*r) → 180°.
    const cx_=x+r, cy_=y+dir*r;
    const sA=dir>0?270:90;
    const arc=arcPts(cx_,cy_,r,sA,180,8);
    const tail=[[x,y+dir*r],[x,y+dir*(r+cogTail)]];
    return {arc,tail};
  }else{
    // Centre at (x-r, y+dir*r). Bar end at (x-r, y) → angle: dir>0?270:90.
    // Leg top at (x, y+dir*r) → 0° (use 360 for dir>0 so sweep goes the short way).
    const cx_=x-r, cy_=y+dir*r;
    const sA=dir>0?270:90;
    const eA=dir>0?360:0;
    const arc=arcPts(cx_,cy_,r,sA,eA,8);
    const tail=[[x,y+dir*r],[x,y+dir*(r+cogTail)]];
    return {arc,tail};
  }
}

function makeHookPts(x,y,db,side,face){
  const r=bendR(db);
  const dir=(face==='top')?-1:1;
  const tail=Math.max(4*db,70);
  const pts=[];
  if(side==='left'){
    // Arc centre at (x, y+dir*r).
    // dir=+1: centre above, bar end at 270°, sweep to 90° (180° CCW through 180°)
    // dir=-1: centre below, bar end at 90°, sweep to 270° (180° CCW through 180°)
    const sA=dir>0?270:90, eA=dir>0?90:270;
    const ap=arcPts(x,y+dir*r,r,sA,eA,16);
    pts.push(...ap);const lp=ap[ap.length-1];pts.push([lp[0]+tail,lp[1]]);
  }else{
    // dir=+1: centre above, bar end at 270°, sweep CW to 450° (180° CW through 360°)
    // dir=-1: centre below, bar end at 90°, sweep CW to 450° (=90+360)... 
    //   actually: 90° → -90° is CW 180°. Use 90 → -90.
    const sA=dir>0?270:90, eA=dir>0?450:-90;
    const ap=arcPts(x,y+dir*r,r,sA,eA,16);
    pts.push(...ap);const lp=ap[ap.length-1];pts.push([lp[0]-tail,lp[1]]);
  }
  return pts;
}

// ================================================================
//  CONCRETE HATCH / BAR FILLS
// ================================================================
// Concrete hatch: ANSI31 at a scale tied to the smaller section dimension
// (300 mm → scale 5, as in sdxf.js examples/beam_section.js)
function concHatch(boundary,a,b){
  return new Hatch(boundary,{pattern:'ANSI31',scale:Math.max(1,Math.round(Math.min(a,b)/60)),layer:'CONC_FILL',color:8});
}
// Filled bar / bar end: circle of two half-circle bulges, SOLID hatched
function solidDisc(x,y,r,o){
  return new Hatch(new LwPolyLine_([[x-r,y],[x+r,y]],{closed:1,bulge:1}),{pattern:'SOLID',...o});
}

// ================================================================
//  DXF EXPORT
// ================================================================
// ================================================================
//  COLUMN SIDE ELEVATIONS
//  Draws 4 side views offset from the section.
//  Front (bottom face looking up), Back (top face), Left, Right.
// ================================================================
function addColumnElevations(ents, c){
  const{W,D,cover,barD,ligD,ligR}=c;
  const barIn=cover+ligD+barD/2;
  const H=+$('colHeight').value||3000;
  const ligSp=Math.max(+$('ligSpacing').value||300, ligD+1);
  const starterExt=+$('starterLap').value||200; // extension beyond column top/bottom
  const starterOff=+$('starterOff').value||10;
  const lap=40*barD; // development length = 40db
  const hc=HOOK_COG[barD]||HOOK_COG[16];
  const cogR=bendR(barD);
  const cogTail=Math.max(0,hc.cog90-cogR);

  const reo={layer:'REO',color:1};
  const conc={layer:'CONCRETE',color:3};

  // Gap between drawings
  const gap=Math.max(W,D)*0.5+200;

  const views = [
    { label:'front', faceW:W, ox:0, oy:-(H+gap),
      getBars:()=>{
        const out=[];
        out.push(c.bars[0].x, c.bars[1].x);
        const nB=+$('barsBot').value;
        if(nB>2){ for(let i=4;i<4+(nB-2);i++) if(c.bars[i]) out.push(c.bars[i].x); }
        return [...new Set(out)].sort((a,b)=>a-b);
      }
    },
    { label:'left', faceW:D, ox:-(D+gap), oy:-(H+gap),
      getBars:()=>{
        const out=[];
        out.push(c.bars[0].y, c.bars[3].y);
        const nB=+$('barsBot').value, nT=+$('barsTop').value;
        const nL=+$('barsLeft').value;
        const topStart=4+(nB>2?nB-2:0)+(nT>2?nT-2:0);
        for(let i=topStart;i<topStart+nL;i++) if(c.bars[i]) out.push(c.bars[i].y);
        return [...new Set(out)].sort((a,b)=>a-b);
      }
    }
  ];

  views.forEach(v=>{
    const ox=v.ox, oy=v.oy;
    const fw=v.faceW;

    // Concrete outline + hatch
    ents.push(concHatch([[ox,oy,0],[ox+fw,oy,0],[ox+fw,oy+H,0],[ox,oy+H,0]],fw,H));
    ents.push(new LwPolyLine_([[ox,oy,0],[ox+fw,oy,0],[ox+fw,oy+H,0],[ox,oy+H,0]],{closed:1,...conc}));

    // Ligature positions: first at 50 + ligD/2 from bottom, then at ligSp, stop at H - 50
    const ligPositions=[];
    let ly=50+ligD/2;
    while(ly < H-50){
      ligPositions.push(ly);
      ly+=ligSp;
    }
    // Always add a final lig at 50mm cover from the top
    const topLig=H-50-ligD/2;
    if(ligPositions.length===0 || ligPositions[ligPositions.length-1]<topLig-1)
      ligPositions.push(topLig);

    const ligEndL=cover+ligD/2;
    const ligEndR=fw-cover-ligD/2;

    ligPositions.forEach(ly_=>{
      ents.push(new LwPolyLine_([[ox+ligEndL,oy+ly_,0],[ox+ligEndR,oy+ly_,0]],{width:ligD,...reo}));
      const pr=ligD/4;
      ents.push(solidDisc(ox+ligEndL,oy+ly_,ligD/2,{...reo}));
      ents.push(solidDisc(ox+ligEndR,oy+ly_,ligD/2,{...reo}));
    });

    // Main bars as outlines (rectangles of width barD, full column height)
    const barXs=v.getBars();
    barXs.forEach(bx=>{
      ents.push(new LwPolyLine_([
        [ox+bx-barD/2,oy,0],[ox+bx+barD/2,oy,0],
        [ox+bx+barD/2,oy+H,0],[ox+bx-barD/2,oy+H,0]
      ],{closed:1,...reo}));
    });

    // Starter bars: solid (wide polyline), lapping 40db with main bars
    // Bottom starters: from (oy - starterExt) to (oy + lap), cog at bottom
    // Top starters: from (oy + H - lap) to (oy + H + starterExt), cog at top
    if(barXs.length>0){
      barXs.forEach((bx,idx)=>{
        let sOff;
        if(idx===0) sOff=starterOff;
        else if(idx===barXs.length-1) sOff=-starterOff;
        else sOff=starterOff;

        const sx=bx+sOff;
        const cogDir=(idx===barXs.length-1)?-1:1;
        const bpr=barD/4;

        // --- Bottom starter ---
        const bBot=oy-starterExt;
        const bTop=oy+lap;
        // Solid bar from bottom of cog arc to top of lap
        ents.push(new LwPolyLine_([[ox+sx,bBot,0],[ox+sx,bTop,0]],{width:barD,...reo}));
        // Solid cap at top (rounded end)
        ents.push(solidDisc(ox+sx,bTop,barD/2,{...reo}));

        // Bottom cog at bBot: vertical bar transitions to horizontal tail
        // Arc centre at (ox+sx+cogDir*cogR, bBot)
        // Bar meets arc at (ox+sx, bBot) → angle: cogDir>0 ? 180° : 0°
        // Arc end at bottom of arc → angle: cogDir>0 ? 270° : 270° but short way
        // For cogDir>0: 180° → 270° = 90° CW sweep ✓
        // For cogDir=-1: 0° → 270° going SHORT way = 0° → -90° (same as 270°)
        const bcCx=ox+sx+cogDir*cogR, bcCy=bBot;
        const bcSA=cogDir>0?180:0;
        const bcEA=cogDir>0?270:-90;
        const bcArc=arcPts(bcCx,bcCy,cogR,bcSA,bcEA,8);
        ents.push(new LwPolyLine_(bcArc.map(p=>[p[0],p[1],0]),{width:barD,...reo}));
        // Tail goes horizontal in cogDir from arc end
        const bcLast=bcArc[bcArc.length-1];
        ents.push(new LwPolyLine_([[bcLast[0],bcLast[1],0],[bcLast[0]+cogDir*cogTail,bcLast[1],0]],{width:barD,...reo}));

        // --- Top starter ---
        const tBot=oy+H-lap;
        const tTop=oy+H+starterExt;
        // Solid bar from bottom of lap to top
        ents.push(new LwPolyLine_([[ox+sx,tBot,0],[ox+sx,tTop,0]],{width:barD,...reo}));
        // Solid cap at bottom (rounded end)
        ents.push(solidDisc(ox+sx,tBot,barD/2,{...reo}));

        // Top cog at tTop: vertical bar transitions to horizontal tail
        // Arc centre at (ox+sx+cogDir*cogR, tTop)
        // Bar meets arc at (ox+sx, tTop) → angle: cogDir>0 ? 180° : 0°
        // Arc end at top of arc → angle: cogDir>0 ? 90° : 90° but short way
        // For cogDir>0: 180° → 90° = 90° CCW sweep ✓
        // For cogDir=-1: 0° → 90° = 90° CCW sweep ✓
        const tcCx=ox+sx+cogDir*cogR, tcCy=tTop;
        const tcSA=cogDir>0?180:0;
        const tcEA=90;
        const tcArc=arcPts(tcCx,tcCy,cogR,tcSA,tcEA,8);
        ents.push(new LwPolyLine_(tcArc.map(p=>[p[0],p[1],0]),{width:barD,...reo}));
        // Tail goes horizontal in cogDir from arc end
        const tcLast=tcArc[tcArc.length-1];
        ents.push(new LwPolyLine_([[tcLast[0],tcLast[1],0],[tcLast[0]+cogDir*cogTail,tcLast[1],0]],{width:barD,...reo}));
      });
    }
  });
}

// ================================================================
//  SLAB/WALL ELEVATIONS
//  Draws 1 or 2 elevations below the section.
//  Dual layer: one for bottom face, one for top face.
//  Single layer: one elevation.
//  Shows transverse bars as horizontal wide polylines with cogs/hooks
//  at their configured spacing, plus starter bars with cogs.
// ================================================================
function addSlabElevations(ents, s){
  const{W,D,cover}=gp();
  const transD=+$('slabTrans').value;
  const longD=+$('slabLong').value;
  const longSp=Math.max(+$('slabLongSp').value||200, longD, 1);
  const horizSp=Math.max(+$('slabHorizSp').value||200, transD, 1);
  const H=+$('slabHeight').value||3000;
  const starterExt=+$('slabStarterExt').value||200;
  const starterOff=+$('slabStarterOff').value||10;
  const dual=layerCfg==='dual';
  const hc=HOOK_COG[transD]||HOOK_COG[16];
  const cogR_t=bendR(transD);
  const cogTail_t=Math.max(0,hc.cog90-cogR_t);
  const hcL=HOOK_COG[longD]||HOOK_COG[16];
  const cogR_l=bendR(longD);
  const cogTail_l=Math.max(0,hcL.cog90-cogR_l);
  const lap=40*longD;

  const reo={layer:'REO',color:1};
  const conc={layer:'CONCRETE',color:3};
  const gap=Math.max(W,D)*0.5+200;

  const elevViews=[];

  if(dual){
    elevViews.push({
      label:'bottom', ox:0, oy:-(H+gap),
      endL:$('endBotL').value, endR:$('endBotR').value, face:'bot'
    });
    elevViews.push({
      label:'top', ox:W+gap, oy:-(H+gap),
      endL:$('endTopL').value, endR:$('endTopR').value, face:'top'
    });
  } else {
    elevViews.push({
      label:'single', ox:0, oy:-(H+gap),
      endL:$('endMidL').value, endR:$('endMidR').value, face:'mid'
    });
  }

  elevViews.forEach(ev=>{
    const ox=ev.ox, oy=ev.oy;

    // Concrete outline + hatch
    ents.push(concHatch([[ox,oy,0],[ox+W,oy,0],[ox+W,oy+H,0],[ox,oy+H,0]],W,H));
    ents.push(new LwPolyLine_([[ox,oy,0],[ox+W,oy,0],[ox+W,oy+H,0],[ox,oy+H,0]],{closed:1,...conc}));

    // Transverse bars (horizontal in elevation) at horizSp vertical spacing
    // These match the section's parallel bars. In elevation they are
    // viewed from the side, so section cogs/hooks appear rotated:
    // - Section cog bends inward (toward section centre)
    // - In elevation, "inward" = downward for bottom face, upward for top face
    //   (i.e. AWAY from the slab surface being viewed)
    const cogDirElev=(ev.face==='top')?1:-1;

    let by_=50+transD/2;
    const barPositions=[];
    while(by_<H-50){
      barPositions.push(by_);
      by_+=horizSp;
    }
    const topBar=H-50-transD/2;
    if(barPositions.length===0||barPositions[barPositions.length-1]<topBar-1)
      barPositions.push(topBar);

    // Use the same x positions as the section for the bar ends
    // Section uses: x1 = cover + db/2 + trim, x2 = W - cover - db/2 - trim
    const bx1=cover+transD/2;
    const bx2=W-cover-transD/2;
    const trimL=(ev.endL!=='none')?bendR(transD):0;
    const trimR=(ev.endR!=='none')?bendR(transD):0;

    barPositions.forEach((by__,bIdx)=>{
      // Cog/hook direction: most bars go cogDirElev (away from surface).
      // For bottom/mid face: the FIRST bar (at base) flips so cog goes UP into the elevation
      // For top face: the LAST bar (at top) flips so cog goes DOWN into the elevation
      let dir=cogDirElev;
      if((ev.face==='bot'||ev.face==='mid') && bIdx===0) dir=-cogDirElev;
      if(ev.face==='top' && bIdx===barPositions.length-1) dir=-cogDirElev;

      // Main horizontal bar (trimmed same as section)
      ents.push(new LwPolyLine_([[ox+bx1+trimL,oy+by__,0],[ox+bx2-trimR,oy+by__,0]],{width:transD,...reo}));

      // Left end cog/hook
      if(ev.endL==='cog90'){
        const acCx=ox+bx1+cogR_t, acCy=oy+by__+dir*cogR_t;
        const acSA=dir>0?270:90;
        const acArc=arcPts(acCx,acCy,cogR_t,acSA,180,8);
        ents.push(new LwPolyLine_(acArc.map(p=>[p[0],p[1],0]),{width:transD,...reo}));
        ents.push(new LwPolyLine_([[ox+bx1,oy+by__+dir*cogR_t,0],[ox+bx1,oy+by__+dir*(cogR_t+cogTail_t),0]],{width:transD,...reo}));
      } else if(ev.endL==='hook180'){
        const hr=bendR(transD);
        const hCx=ox+bx1+trimL, hCy=oy+by__+dir*hr;
        const hSA=dir>0?270:90, hEA=dir>0?90:270;
        const hArc=arcPts(hCx,hCy,hr,hSA,hEA,16);
        ents.push(new LwPolyLine_(hArc.map(p=>[p[0],p[1],0]),{width:transD,...reo}));
        const hLast=hArc[hArc.length-1];
        const hTail=Math.max(4*transD,70);
        ents.push(new LwPolyLine_([[hLast[0],hLast[1],0],[hLast[0]+hTail,hLast[1],0]],{width:transD,...reo}));
      }

      // Right end cog/hook
      if(ev.endR==='cog90'){
        const acCx=ox+bx2-cogR_t, acCy=oy+by__+dir*cogR_t;
        const acSA=dir>0?270:90;
        const acEA=dir>0?360:0;
        const acArc=arcPts(acCx,acCy,cogR_t,acSA,acEA,8);
        ents.push(new LwPolyLine_(acArc.map(p=>[p[0],p[1],0]),{width:transD,...reo}));
        ents.push(new LwPolyLine_([[ox+bx2,oy+by__+dir*cogR_t,0],[ox+bx2,oy+by__+dir*(cogR_t+cogTail_t),0]],{width:transD,...reo}));
      } else if(ev.endR==='hook180'){
        const hr=bendR(transD);
        const hCx=ox+bx2-trimR, hCy=oy+by__+dir*hr;
        const hSA=dir>0?270:90, hEA=dir>0?450:-90;
        const hArc=arcPts(hCx,hCy,hr,hSA,hEA,16);
        ents.push(new LwPolyLine_(hArc.map(p=>[p[0],p[1],0]),{width:transD,...reo}));
        const hLast=hArc[hArc.length-1];
        const hTail=Math.max(4*transD,70);
        ents.push(new LwPolyLine_([[hLast[0],hLast[1],0],[hLast[0]-hTail,hLast[1],0]],{width:transD,...reo}));
      }
    });

    // Longitudinal bars as outlines (vertical rectangles)
    // Use the actual circle x-positions from slabGeom so spacing matches section
    // (accounts for encroachment from cogs/hooks pushing bars inward)
    const usedXs=new Set();
    s.circles.forEach(cb=>{
      const rx=Math.round(cb.x*100)/100; // deduplicate by rounding
      if(!usedXs.has(rx)){
        usedXs.add(rx);
        ents.push(new LwPolyLine_([
          [ox+cb.x-longD/2,oy,0],[ox+cb.x+longD/2,oy,0],
          [ox+cb.x+longD/2,oy+H,0],[ox+cb.x-longD/2,oy+H,0]
        ],{closed:1,...reo}));
      }
    });

    // Starter bars: solid wide polylines with cogs, lapping 40×longD
    // At each unique longitudinal bar x-position from the section
    const starterXs=[...usedXs].sort((a,b)=>a-b);
    starterXs.forEach((lx,i)=>{
      let sOff;
      if(i===0) sOff=starterOff;
      else if(i===starterXs.length-1) sOff=-starterOff;
      else sOff=starterOff;
      const sx=lx+sOff;
      const cogDir=(i===starterXs.length-1)?-1:1;
      const bpr=longD/4;

      // Bottom starter: from (oy - starterExt) to (oy + lap)
      const bBot=oy-starterExt;
      const bTop=oy+lap;
      ents.push(new LwPolyLine_([[ox+sx,bBot,0],[ox+sx,bTop,0]],{width:longD,...reo}));
      ents.push(solidDisc(ox+sx,bTop,longD/2,{...reo}));
      // Bottom cog
      const bcCx=ox+sx+cogDir*cogR_l, bcCy=bBot;
      const bcSA=cogDir>0?180:0;
      const bcEA=cogDir>0?270:-90;
      const bcArc=arcPts(bcCx,bcCy,cogR_l,bcSA,bcEA,8);
      ents.push(new LwPolyLine_(bcArc.map(p=>[p[0],p[1],0]),{width:longD,...reo}));
      const bcLast=bcArc[bcArc.length-1];
      ents.push(new LwPolyLine_([[bcLast[0],bcLast[1],0],[bcLast[0]+cogDir*cogTail_l,bcLast[1],0]],{width:longD,...reo}));

      // Top starter: from (oy + H - lap) to (oy + H + starterExt)
      const tBot=oy+H-lap;
      const tTop=oy+H+starterExt;
      ents.push(new LwPolyLine_([[ox+sx,tBot,0],[ox+sx,tTop,0]],{width:longD,...reo}));
      ents.push(solidDisc(ox+sx,tBot,longD/2,{...reo}));
      // Top cog
      const tcCx=ox+sx+cogDir*cogR_l, tcCy=tTop;
      const tcSA=cogDir>0?180:0;
      const tcEA=90;
      const tcArc=arcPts(tcCx,tcCy,cogR_l,tcSA,tcEA,8);
      ents.push(new LwPolyLine_(tcArc.map(p=>[p[0],p[1],0]),{width:longD,...reo}));
      const tcLast=tcArc[tcArc.length-1];
      ents.push(new LwPolyLine_([[tcLast[0],tcLast[1],0],[tcLast[0]+cogDir*cogTail_l,tcLast[1],0]],{width:longD,...reo}));
    });
  });
}

function makeDXF(){
  const{W,D,cover}=gp();
  const layers=[new Layer_({name:'CONCRETE',color:3}),new Layer_({name:'REO',color:1}),new Layer_({name:'CONC_FILL',color:8}),new Layer_()];
  const ents=[];

  if(mode==='column'){
    const c=colGeom();
    const ch=c.chamfer;
    const outline=ch>0?[[ch,0,0],[W-ch,0,0],[W,ch,0],[W,D-ch,0],[W-ch,D,0],[ch,D,0],[0,D-ch,0],[0,ch,0]]:[[0,0,0],[W,0,0],[W,D,0],[0,D,0]];
    ents.push(concHatch(outline,W,D));
    ents.push(new LwPolyLine_(outline,{closed:1,layer:'CONCRETE',color:3}));
    const lp=roundedRectPts(c.lx,c.by,c.rx,c.ty,c.ligR);
    ents.push(new LwPolyLine_(lp.map(p=>[p[0],p[1],0]),{closed:1,width:c.ligD,layer:'REO',color:1}));
    c.bars.forEach(b=>{
      ents.push(new Circle_([b.x,b.y,0],c.barD/2,{layer:'REO',color:1}));
      const pr=c.barD/4;
      ents.push(solidDisc(b.x,b.y,c.barD/2,{layer:'REO',color:1}));
    });
    // Side elevations if checkbox is ticked
    if($('inclElev').checked) addColumnElevations(ents, c);
  }else{
    const outline=[[0,0,0],[W,0,0],[W,D,0],[0,D,0]];
    ents.push(concHatch(outline,W,D));
    ents.push(new LwPolyLine_(outline,{closed:1,layer:'CONCRETE',color:3}));
    const s=slabGeom();
    s.lines.forEach(l=>{
      // Main bar uses trimmed x1/x2 (shortened by bend radius where cog/hook present)
      ents.push(new LwPolyLine_([[l.x1,l.y,0],[l.x2,l.y,0]],{width:l.dia,layer:'REO',color:1}));
      // Cogs: arc + tail as separate polylines. Hooks: single polyline from bar end.
      if(l.endLeft==='cog90'){
        const c=makeCogPts(l.cogX1,l.y,l.dia,'left',l.face);
        ents.push(new LwPolyLine_(c.arc.map(q=>[q[0],q[1],0]),{width:l.dia,layer:'REO',color:1}));
        ents.push(new LwPolyLine_(c.tail.map(q=>[q[0],q[1],0]),{width:l.dia,layer:'REO',color:1}));
      } else if(l.endLeft==='hook180'){const p=makeHookPts(l.x1,l.y,l.dia,'left',l.face);ents.push(new LwPolyLine_(p.map(q=>[q[0],q[1],0]),{width:l.dia,layer:'REO',color:1}));}
      if(l.endRight==='cog90'){
        const c=makeCogPts(l.cogX2,l.y,l.dia,'right',l.face);
        ents.push(new LwPolyLine_(c.arc.map(q=>[q[0],q[1],0]),{width:l.dia,layer:'REO',color:1}));
        ents.push(new LwPolyLine_(c.tail.map(q=>[q[0],q[1],0]),{width:l.dia,layer:'REO',color:1}));
      } else if(l.endRight==='hook180'){const p=makeHookPts(l.x2,l.y,l.dia,'right',l.face);ents.push(new LwPolyLine_(p.map(q=>[q[0],q[1],0]),{width:l.dia,layer:'REO',color:1}));}
    });
    s.circles.forEach(c=>{
      ents.push(new Circle_([c.x,c.y,0],c.dia/2,{layer:'REO',color:1}));
      const pr=c.dia/4;
      ents.push(solidDisc(c.x,c.y,c.dia/2,{layer:'REO',color:1}));
    });
    // Slab/wall elevations if checkbox is ticked
    if($('inclSlabElev').checked) addSlabElevations(ents, s);
  }


  // Expand extents if elevations are included
  let emin=[-10,-10], emax=[W+10,D+10];
  if(mode==='column' && $('inclElev').checked){
    const H=+$('colHeight').value||3000;
    const starterLap=+$('starterLap').value||200;
    const g=Math.max(W,D)*0.5+200;
    emin=[-(D+g+10), -(H+g+starterLap+300)];
    emax=[W+g+D+10, D+g+H+starterLap+300];
  }
  if(mode==='slab' && $('inclSlabElev').checked){
    const H=+$('slabHeight').value||3000;
    const sExt=+$('slabStarterExt').value||200;
    const g=Math.max(W,D)*0.5+200;
    emin=[-(10), -(H+g+sExt+300)];
    emax=[W+g+W+10, D+10];
  }
  return new Drawing_({layers,entities:ents,extmin:emin,extmax:emax}).toString();
}

$('exportBtn').addEventListener('click',()=>{
  try{
    const dxf=makeDXF();const blob=new Blob([dxf],{type:'application/dxf'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`section_${mode}_${$('secWidth').value}x${$('secDepth').value}.dxf`;
    a.click();URL.revokeObjectURL(a.href);
  }catch(e){alert('Export error: '+e.message);console.error(e);}
});

$('copyBtn').addEventListener('click',()=>{
  try{
    const dxf=makeDXF();
    navigator.clipboard.writeText(dxf).then(()=>{
      const btn=$('copyBtn');
      btn.textContent='COPIED!';btn.style.background='var(--accent)';btn.style.color='#111';
      setTimeout(()=>{btn.textContent='COPY TO CLIPBOARD';btn.style.background='#363b4a';btn.style.color='';},1500);
    }).catch(()=>{
      // Fallback for older browsers / non-HTTPS
      const ta=document.createElement('textarea');ta.value=dxf;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
      const btn=$('copyBtn');
      btn.textContent='COPIED!';btn.style.background='var(--accent)';btn.style.color='#111';
      setTimeout(()=>{btn.textContent='COPY TO CLIPBOARD';btn.style.background='#363b4a';btn.style.color='';},1500);
    });
  }catch(e){alert('Copy error: '+e.message);console.error(e);}
});

window.addEventListener('resize',redraw);
redraw();
</script>
